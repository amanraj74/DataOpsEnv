[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataops-env"
version = "1.0.0"
description = "AI Data Engineering Agent Benchmark — OpenEnv Environment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "DataOpsEnv Team"},
]

dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
server = "server.app:main"
