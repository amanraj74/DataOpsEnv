[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataops-env"
version = "1.0.0"
description = "AI Data Engineering Agent Benchmark — OpenEnv Environment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "DataOpsEnv Team"},
]

dependencies = [
    "openenv-core>=0.2.0",
    "openenv>=0.1.13",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pandas>=2.0.0",
    "websockets",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["server"]

[tool.setuptools.package-data]
dataops_env = ["**/*.yaml", "**/*.yml", "**/*.md"]
